name: Validate and test
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Question bank integrity
        run: python3 scripts/validate_bank.py
      - name: Service worker is stamped for the current files
        run: python3 scripts/build_sw.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test tests/unit.test.mjs
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm i --no-save playwright@1.49.0 && npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          python3 -m http.server 8766 --directory pwa-deploy &
          sleep 2
          node tests/e2e.mjs
  supabase-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply the migration on a clean database
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/prelude.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migration.sql
      - name: The migration can be re-run safely
        run: psql -v ON_ERROR_STOP=1 -f supabase/migration.sql
      - name: Security and activation tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/run.sql
