name: Build Cloudflare Pages artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://arlunvwmuhrknvctjuew.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_q7y6ExUi-Jn9ND8Ugejuog_qi_nEHXj

      - name: Upload Pages output
        uses: actions/upload-artifact@v4
        with:
          name: aden-medical-test-dist
          path: dist/
          if-no-files-found: error
          retention-days: 2
